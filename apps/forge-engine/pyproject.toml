[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-engine"
version = "0.1.0"
description = "ForgeAI engine — local-first CLI workbench for small and mid-sized LLM training experiments"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "tokenizers>=0.19.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
mlx = ["mlx>=0.12.0", "mlx-lm>=0.12.0"]
hf = ["huggingface_hub>=0.23.0"]
llama-cpp = ["llama-cpp-python>=0.2.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
forge = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
